syntax = "proto2";

package destiny.v36735.bap;

// Destiny 36735.13.12.02.1953.alpha client_to_xetrov_notification (BAP 171),
// encoded by sub_82B81780. The client's decode slot for it asserts, so the
// server never replies.
//
// Field 4 is XetrovPackedEvent: type + payload bytes. The payload is a
// 696-byte XetrovClientEvent, gathered by sub_82979A70. Names come from the
// xetrov: debug logs.
//
// Kill/death/resurrect payloads omit fields the heartbeat always fills, so
// ClientEvent fields are optional even when nanopb marked them required.

message ClientToXetrovNotification {
  required uint32 reserved1 = 1;
  required uint32 reserved2 = 2;
  optional uint64 reserved3 = 3;
  required bytes event = 4;
}

// The client wraps its event in this (sub_8368FE40, a35 = type).
message XetrovPackedEvent {
  required uint32 type = 1;
  required bytes payload = 2;
}

enum XetrovEventType {
  HEARTBEAT = 0;
  KILL = 1;
  DEATH = 2;
  RESURRECT = 3;
  ABILITY = 4;
}

