syntax = "proto2";

package destiny.v41375.content;

// Content manifest, fetched in bootflow:content_check from the Engine
// Configuration URL and parsed by sub_82411EA0 (nanopb 0x82110180). The real
// server wraps it in u32 1, u32 0 and an RSA-PSS signature; with the
// signature flag cleared the body is just this message.

// List 3 entry (280 bytes in the client), registered by
// register_manifest_patchable_packages.
message ManifestPackage {
  // DLC offer id; 0xBxxxxxxx ids need a matching list 2 entry. 0 for disc.
  required uint32 offer_id = 1;
  // Package file basename; mounted as "packages\\<name>.pkg".
  required string name = 2;
  // Must equal the package header id (+4), 0x0A..0x17FF.
  optional uint32 package_id = 3;
  // Must equal the u64 at package header +8. True name unknown.
  optional uint64 header_value = 4;
}

message ContentManifest {
  // Lists 1, 2 and 4 are Xbox content records (DLC), true names unknown.
  repeated ManifestPackage packages = 3;
  // Must equal Engine Configuration 1.3 (content_guid).
  optional string guid = 5;
}
