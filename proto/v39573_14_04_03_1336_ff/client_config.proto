syntax = "proto2";

package destiny.v39573.bap;

// client_to_bap_client_config_request (BAP 0x12, 0xA1E7D0) is not protobuf:
// the body is one u64, big-endian.
//
// client_to_bap_client_config_response (BAP 0x13, 0xA1E890) uses nanopb
// 0x24D3300, the same table as signon response field 4.
message ClientConfigResponse {
  required uint64 cookie = 1;
  required uint32 social_matchmaking_id = 2;
  // EngineConfiguration (signon.proto), a callback field decoded in place
  optional bytes engine_configuration = 3;
}
