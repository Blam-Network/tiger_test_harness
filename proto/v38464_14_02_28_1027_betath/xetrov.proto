syntax = "proto2";

package destiny.v38464.bap;

// client_to_xetrov_request (BAP 0xAB, 0x9F93D0). Same envelope as the Alpha
// Trial; the event payload layout is not dumped for this build.
message ClientToXetrovNotification {
  required uint32 reserved1 = 1;
  required uint32 reserved2 = 2;
  optional uint64 reserved3 = 3;
  // up to 145024 bytes
  required bytes event = 4;
}
