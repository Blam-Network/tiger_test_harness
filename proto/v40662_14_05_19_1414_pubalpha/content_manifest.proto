syntax = "proto2";

package destiny.v40662.content;

// Content manifest: HTTPS GET of Engine Configuration 1.2 in
// bootflow:content_check (sub_B85C20), parsed by sub_719900 (nanopb
// 0x20600B0). The signature flag is 1 and never written, so the body is u32 1,
// u32 0, a 256-byte RSA-PSS signature (SHA-256, salt 16) and then this
// message.

// List 1 entry. Ids in lists 1 and 2 must be unique.
message ManifestUnknown1 {
  required uint32 id = 1;
  // 128 chars
  required string unknown2 = 2;
  required uint32 unknown3 = 3;
  // 128 chars
  optional string unknown4 = 4;
}

message ManifestUnknown2Name {
  // 48 chars
  required string unknown1 = 1;
}

message ManifestUnknown2Keys {
  // up to 16 bytes each
  required bytes unknown1 = 1;
  required bytes unknown2 = 2;
  required bytes unknown3 = 3;
}

message ManifestUnknown2Label {
  // 48 chars
  optional string unknown1 = 1;
}

message ManifestUnknown2Detail {
  optional ManifestUnknown2Name unknown1 = 1;
  optional ManifestUnknown2Keys unknown2 = 2;
  optional ManifestUnknown2Label unknown3 = 3;
}

// List 2 entry.
message ManifestUnknown2 {
  required uint32 id = 1;
  required uint32 unknown2 = 2;
  required ManifestUnknown2Detail unknown3 = 3;
  required uint32 unknown4 = 4;
  required bool unknown5 = 5;
}

// List 3 entry (280 bytes in the client), same shape as the Xbox builds.
message ManifestPackage {
  required uint32 offer_id = 1;
  // Package file basename, 256 chars
  required string name = 2;
  optional uint32 package_id = 3;
  optional uint64 header_value = 4;
}

// List 4 entry.
message ManifestUnknown4 {
  // 256 chars
  optional string unknown1 = 1;
  optional uint32 unknown2 = 2;
}

message ContentManifest {
  // up to 64
  repeated ManifestUnknown1 unknown1 = 1;
  // up to 64
  repeated ManifestUnknown2 unknown2 = 2;
  // up to 800
  repeated ManifestPackage packages = 3;
  // up to 256
  repeated ManifestUnknown4 unknown4 = 4;
  // Required and must equal Engine Configuration 1.3
  optional string guid = 5;
}
