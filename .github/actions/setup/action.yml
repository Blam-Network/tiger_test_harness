name: Set up
description: Node 24, the tiger packages from the vendor/tiger submodule, and this repo's dependencies. Run after a checkout with submodules.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          vendor/tiger/package-lock.json

    # Only the tiger packages this repo links, without the debugger and viewer
    # apps (package.json tiger:build).
    - name: Build tiger
      shell: bash
      run: npm run tiger:build

    - name: Install
      shell: bash
      run: npm ci
