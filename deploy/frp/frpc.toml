# frp client — runs ON THE MACHINE HOSTING web-tiger, next to the server.
#
#   ./frpc -c frpc.toml
#
# Each proxy publishes one local port on the VPS under the SAME number. The
# client dials fixed ports, so remotePort must always equal localPort.

serverAddr = "YOUR.VPS.IP.HERE"
serverPort = 7000

auth.method = "token"
auth.token = "CHANGE-ME"

# Demonware lobby (raw TCP)
[[proxies]]
name = "demonware-1011"
type = "tcp"
localIP = "127.0.0.1"
localPort = 1011
remotePort = 1011

[[proxies]]
name = "demonware-1020"
type = "tcp"
localIP = "127.0.0.1"
localPort = 1020
remotePort = 1020

# Sign-on (HTTP, tunnelled as TCP so the port is preserved verbatim)
